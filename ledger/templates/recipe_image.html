{% extends 'base.html' %}

{% block pageheader %}
    <h2>Add Image for {{ recipe.name }} Recipe</h2>
{% endblock %}

{% block body %}
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Upload Image</button>
    </form>

    <br>
    <i>Change your mind?</i>
    <a href="{% url 'ledger:recipe_detail' pk=recipe.pk %}">Back to Recipe Detail</a>
{% endblock %}
