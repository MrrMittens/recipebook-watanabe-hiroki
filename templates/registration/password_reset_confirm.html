{% include 'base.html' %}

{% block pageheader %}
    <h2>Password Reset Confirm</h2>
{% endblock %}

{% block body %}
    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit" value="Change password">
        </form>
    {% else %}
        <p>Invalid password reset link!</p>
    {% endif %}
{% endblock %}
